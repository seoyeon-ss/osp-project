<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>음식 GI 및 영양 분석</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px auto;
            max-width: 900px;
            background-color: #f7f8fb;
            color: #222;
        }

        video {
            border: 2px solid #cccccc;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2f75b5;
            color: white;
            font-weight: bold;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        .section {
            background-color: white;
            border-radius: 14px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .description {
            color: #555;
            line-height: 1.6;
        }

        .link-button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 8px;
            background-color: #4f81bd;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>음식 GI 및 영양 분석</h1>
    <p class="description">
        음식 사진을 촬영하거나 이미지 파일을 업로드하면<br>
        인식된 음식의 GI 지수와 영양소 정보를 분석합니다.
    </p>

    <a class="link-button" href="/history">섭취 기록 보기</a>

    <div class="section">
        <h2>카메라 촬영</h2>

        <video id="video" width="320" height="240" autoplay playsinline muted></video>

        <p id="cameraStatus">카메라 연결을 준비하고 있습니다.</p>

        <br>

        <button id="captureButton" type="button" onclick="captureImage()" disabled>
            촬영 후 분석
        </button>

        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

        <form id="cameraForm" action="/predict" method="POST">
            <input type="hidden" name="image" id="imageInput">
        </form>
    </div>

    <div class="section">
        <h2>파일 업로드</h2>

        <form action="/predict" method="POST" enctype="multipart/form-data">
            <input id="fileInput" name="file" type="file"
                   accept="image/png,image/jpeg,image/webp" required>
            <br><br>
            <button type="submit">파일 분석</button>
        </form>
    </div>

    <script>
        const video = document.getElementById("video");
        const cameraStatus = document.getElementById("cameraStatus");
        const captureButton = document.getElementById("captureButton");

        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                cameraStatus.textContent =
                    "실시간 카메라는 HTTPS 주소 또는 컴퓨터의 localhost에서 사용할 수 있습니다.";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();
                captureButton.disabled = false;
                cameraStatus.textContent = "카메라가 연결되었습니다.";
            } catch (error) {
                if (error.name === "NotAllowedError") {
                    cameraStatus.textContent =
                        "카메라 권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용해주세요.";
                } else if (error.name === "NotFoundError") {
                    cameraStatus.textContent = "사용할 수 있는 카메라를 찾지 못했습니다.";
                } else {
                    cameraStatus.textContent = `카메라 연결 실패: ${error.message}`;
                }
            }
        }

        function captureImage() {
            const canvas = document.getElementById("canvas");
            const context = canvas.getContext("2d");

            if (!video.videoWidth || !video.videoHeight) {
                cameraStatus.textContent = "카메라 화면이 준비된 후 다시 촬영해주세요.";
                return;
            }

            const maxWidth = 1280;
            const scale = Math.min(1, maxWidth / video.videoWidth);
            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL("image/jpeg", 0.9);
            document.getElementById("imageInput").value = imageData;
            document.getElementById("cameraForm").submit();
        }

        startCamera();

    </script>
</body>
</html>
